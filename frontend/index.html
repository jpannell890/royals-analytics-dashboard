<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kansas City Royals Dashboard</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <h1>Kansas City Royals Dashboard</h1>

    <section id="record-section" class="section">
      <h2>AL Central Standings</h2>
      <pre id="record" class="section"></pre>
    </section>

    <section id="schedule-section" class="section">
        <h2>Schedule</h2>
        <pre id="schedule" class="section"></pre>
    </section>

    <section id="players-section" class="section">
        <h2>Roster</h2>
        <pre id="players" class="section"></pre>
    </section>

    <section id="stats-section" class="section">
        <h2>Team Stats</h2>

        <pre id="hitting" class="section"></pre>
        <pre id="pitching" class="section"></pre>
        <pre id="fielding" class="section"></pre>
    </section>

    <script src="script.js"></script>

  </body>
</html>
