<!doctype html>
<html>
  <head>

    <title>Kansas City Royals Dashboard</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <h1>Kansas City Royals Dashboard</h1>

    <section id="record-section">
      <h2>Standings</h2>
      <pre id="record"></pre>
    </section>

    <section id="schedule-section">
        <h2>Schedule</h2>
        <pre id="schedule"></pre>
    </section>

    <section id="players-section">
        <h2>Roster</h2>
        <pre id="players"></pre>
    </section>

    <section id="stats-section">
        <h2>Team Stats</h2>
        <pre id="stats"></pre>
    </section>

    <script src="script.js"></script>

  </body>
</html>
